<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Encargo · ALDEA</title>
<!-- Tarjeta de vista previa: WhatsApp la muestra encima del enlace (no lleva datos del encargo) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ALDEA">
<meta property="og:title" content="📨 Encargo para ti · Toca para contestar">
<meta property="og:description" content="Mira la ficha y contesta Acepto o No puedo.">
<meta property="og:image" content="https://victorh2p3.github.io/aldea-actualizaciones/encargo.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
/* Ficha de un encargo de ALDEA Niños. Los datos van en el enlace tras «#»: el navegador NO los envia a ningun
   servidor; esta pagina solo los lee y los muestra. Autor y propietario: VicH. */
:root { --bg:#f5f3ff; --card:#fff; --fg:#1f1b2e; --muted:#6b6880; --line:#e4e0f2; --acento:#6d28d9;
        --si:#15803d; --no:#b91c1c; --alerta-bg:#fee2e2; --alerta:#991b1b; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --bg:#14111d; --card:#1e1a2b; --fg:#ece9f5; --muted:#a39fb6;
        --line:#2e2840; --acento:#a78bfa; --si:#22c55e; --no:#f87171; --alerta-bg:#3b1414; --alerta:#fca5a5; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
main { max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
.marca { font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--acento); }
.ficha { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:8px; }
h1 { font-size:1.45rem; line-height:1.2; margin:0 0 4px; text-wrap:balance; }
.alergia { background:var(--alerta-bg); color:var(--alerta); border-radius:12px; padding:10px 12px; font-weight:800; }
.fila { display:flex; gap:10px; align-items:flex-start; }
.fila span:first-child { width:1.4em; flex-shrink:0; text-align:center; }
.muted { color:var(--muted); font-size:.92rem; }
ul { margin:2px 0 0; padding-left:1.2em; }
.botones { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
button, .boton { font:inherit; font-weight:700; border:none; border-radius:16px; padding:18px 10px; font-size:1.1rem; cursor:pointer;
                 text-align:center; text-decoration:none; display:block; }
.si { background:var(--si); color:#fff; } .no { background:var(--no); color:#fff; }
.sec { background:transparent; color:var(--acento); border:2px solid var(--acento); font-size:1rem; padding:13px; }
button:focus-visible, .boton:focus-visible, input:focus-visible { outline:3px solid var(--acento); outline-offset:2px; }
input { font:inherit; width:100%; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
[hidden] { display:none !important; }
.estado { font-size:1.3rem; font-weight:800; }
</style>
</head>
<body>
<main id="main">
  <div class="marca">ALDEA · Encargo</div>
  <div class="ficha"><p>Cargando…</p></div>
</main>
<script>
(function () {
  var AQUI = location.origin + location.pathname;
  var QUE = {ida: 'llevar', vuelta: 'recoger', cuidar: 'cuidar'};
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var main = document.getElementById('main');
  var esAndroid = /Android/i.test(navigator.userAgent);

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  function mayus(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function diaLargo(f) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || '');
    if (!m) return f || '';
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    var t = mayus(DIAS[d.getDay()]) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    return d.getFullYear() === new Date().getFullYear() ? t : t + ' de ' + d.getFullYear();
  }
  function horas(d) { return d.hi && d.hf ? 'De ' + d.hi + ' a ' + d.hf : (d.hi || d.hf) ? 'A las ' + (d.hi || d.hf) : ''; }
  function abrirEnAldea(tipo, codigo) {
    // Android: intent con vuelta a la pagina de descarga si ALDEA no esta instalada
    return esAndroid ? 'intent://' + tipo + '/' + codigo + '#Intent;scheme=aldea;S.browser_fallback_url='
      + encodeURIComponent('https://victorh2p3.github.io/aldea-actualizaciones/') + ';end' : 'aldea://' + tipo + '/' + codigo;
  }
  function b64aBytes(t) {
    t = t.replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var s = atob(t), b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  function bytesAb64(b) {
    var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function leer(codigo) {
    var b = b64aBytes(codigo);
    if (b[0] === 0x78) {   // comprimido (zlib) por ALDEA
      if (!window.DecompressionStream) throw new Error('viejo');
      var flujo = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'));
      b = new Uint8Array(await new Response(flujo).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(b));
  }
  function pintar(html) { main.innerHTML = '<div class="marca">ALDEA · Encargo</div>' + html; }

  function ficha(d) {
    var que = (QUE[d.q] || 'cuidar') + ' a ' + d.n;
    var h = '<div class="ficha"><h1>🧒 ¿Puedes ' + esc(que) + '?</h1>';
    if (d.a) h += '<div class="alergia">🚨 ALERGIA GRAVE: ' + esc(String(d.a).toUpperCase()) + '</div>';
    h += '<div class="fila"><span>📅</span><b>' + esc(diaLargo(d.f)) + '</b></div>';
    if (horas(d)) h += '<div class="fila"><span>🕘</span><span>' + esc(horas(d)) + '</span></div>';
    if (d.d) h += '<div class="fila"><span>📍</span><span>' + esc(d.d) + '</span></div>';
    if (d.e) h += '<div class="fila"><span>🎒</span><div><b>Qué llevar</b><ul>' + String(d.e).split('\n').filter(function (x) { return x.trim(); })
      .map(function (x) { return '<li>' + esc(x.trim()) + '</li>'; }).join('') + '</ul></div></div>';
    if (d.o) h += '<div class="fila"><span>📝</span><span>' + esc(d.o) + '</span></div>';
    if (d.de) h += '<p class="muted" style="margin:4px 0 0">Te lo pide <b>' + esc(d.de) + '</b></p>';
    return h + '</div>';
  }

  function verEncargo(d, codigo) {
    pintar(ficha(d)
      + '<div class="botones"><button class="si" id="si">✅ Acepto</button><button class="no" id="no">❌ No puedo</button></div>'
      + '<a class="boton sec" href="' + esc(abrirEnAldea('encargo', codigo)) + '">📲 ¿Tienes ALDEA? Ábrelo en la app</a>');
    document.getElementById('si').onclick = function () { pedirNombre(d, true); };
    document.getElementById('no').onclick = function () { pedirNombre(d, false); };
  }

  function pedirNombre(d, acepto) {
    var guardado = ''; try { guardado = localStorage.getItem('aldea_nombre') || ''; } catch (e) {}
    pintar(ficha(d) + '<div class="ficha"><label for="nombre"><b>¿Cómo te llamas?</b></label>'
      + '<p class="muted" style="margin:0">Para que ' + esc(d.de || 'quien lo pidió') + ' sepa quién contesta.</p>'
      + '<input id="nombre" maxlength="60" autocomplete="given-name" value="' + esc(guardado) + '">'
      + '<button class="' + (acepto ? 'si' : 'no') + '" id="enviar">' + (acepto ? '✅ Enviar «Acepto» por WhatsApp' : '❌ Enviar «No puedo» por WhatsApp') + '</button>'
      + '<button class="sec" id="volver">Volver</button></div>');
    var campo = document.getElementById('nombre');
    if (!guardado) campo.focus();
    document.getElementById('volver').onclick = function () { verEncargo(d, location.hash.slice(3)); };
    document.getElementById('enviar').onclick = function () {
      var n = campo.value.trim();
      if (!n) { campo.focus(); return; }
      try { localStorage.setItem('aldea_nombre', n); } catch (e) {}
      var r = {v: 2, u: d.u, a: acepto ? 1 : 0, n: n.slice(0, 60), k: d.n, q: d.q, f: d.f};
      var codigo = bytesAb64(new TextEncoder().encode(JSON.stringify(r)));
      var que = (QUE[d.q] || 'cuidar') + ' a ' + d.n;
      var t = (acepto ? '✅ *ACEPTO: ' + mayus(que) + '*' : '❌ *NO PUEDO ' + que + '*') + '\n\n📅 ' + diaLargo(d.f)
        + (horas(d) ? '\n🕘 ' + horas(d) : '') + '\n\n— *' + n + '*\n\n_Para apuntarlo en ALDEA:_\n' + AQUI + '#r=' + codigo;
      location.href = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(t);
    };
  }

  function verRespuesta(d, codigo) {
    var que = (QUE[d.q] || 'cuidar') + (d.k ? ' a ' + d.k : '');
    pintar('<div class="ficha"><div class="estado" style="color:var(--' + (d.a ? 'si' : 'no') + ')">'
      + (d.a ? '✅ ' + esc(d.n || 'Ha') + ' ACEPTA' : '❌ ' + esc(d.n || 'No') + ' NO PUEDE') + '</div>'
      + '<div>' + esc(mayus(que)) + (d.f ? ' · ' + esc(diaLargo(d.f)) : '') + '</div></div>'
      + '<a class="boton si" href="' + esc(abrirEnAldea('respuesta', codigo)) + '">📲 Apuntarlo en ALDEA</a>'
      + '<p class="muted">Se abre ALDEA y el encargo queda marcado. Si no tienes ALDEA, no hace falta hacer nada más.</p>');
  }

  var m = /^#([er])=([A-Za-z0-9_-]{10,})$/.exec(location.hash);
  if (!m) { pintar('<div class="ficha"><p>Este enlace no trae ningún encargo. Pide que te lo vuelvan a mandar.</p></div>'); return; }
  leer(m[2]).then(function (d) {
    if (m[1] === 'e') verEncargo(d, m[2]); else verRespuesta(d, m[2]);
  }).catch(function (e) {
    pintar('<div class="ficha"><p>' + (e.message === 'viejo'
      ? 'Este navegador es antiguo y no puede abrir el encargo. Ábrelo con Chrome, o contesta en WhatsApp ACEPTO o NO PUEDO.'
      : 'El enlace está incompleto. Pide que te lo vuelvan a mandar, o contesta en WhatsApp ACEPTO o NO PUEDO.') + '</p></div>');
  });
})();
</script>
</body>
</html>
